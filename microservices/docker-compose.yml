x-postgres-common: &postgres-common
  image: postgres:13
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-grocellery}
    POSTGRES_DB: ${POSTGRES_DB:-grocery}
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-grocellery} -d ${POSTGRES_DB:-grocery}"]
    start_period: 30s
    interval: 5s
    timeout: 5s
    retries: 20

services:
  redis:
    image: redis:7-alpine
    container_name: grocery-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  cart-db:
    <<: *postgres-common
    container_name: cart-db
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    networks:
      - backend

  order-db:
    <<: *postgres-common
    container_name: order-db
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - backend

  product-db:
    <<: *postgres-common
    container_name: product-db
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - backend

  ledger-db:
    <<: *postgres-common
    container_name: ledger-db
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    networks:
      - backend

  kafka:
    # Single-node broker for local development only. Production uses managed Kafka provisioned by IaC.
    image: apache/kafka:4.3.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  kafka-init:
    image: apache/kafka:4.3.0
    container_name: kafka-init
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_ORDER_CREATED_TOPIC:-order.created.v1} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_ORDER_CREATED_TOPIC:-order.created.v1}.failed --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  gateway-service:
    build:
      context: ..
      dockerfile: microservices/gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # cart-service is the demo OIDC issuer; gateway fetches JWKS from it
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://cart-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-grocery-api}
      # Set to your frontend origin(s), comma-separated — no wildcard
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Rate limiting — override per environment
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
      GATEWAY_RATE_LIMIT_REQUESTED_TOKENS: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:-1}
    ports:
      # Host 8085 → container 8080 (avoids conflict with services on 8081–8084)
      - "8085:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      cart-service:
        # Gateway validates JWTs via cart-service JWKS — it must be up first
        condition: service_healthy
    networks:
      - backend

  cart-service:
    build:
      context: ..
      dockerfile: microservices/cart-service/Dockerfile
    container_name: cart-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/cart
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://cart-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-grocery-api}
      DEMO_IDENTITY_ENABLED: ${CART_DEMO_IDENTITY_ENABLED:-true}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in microservices/.env}
    ports:
      - "8081:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      cart-db:
        condition: service_healthy
    networks:
      - backend

  order-service:
    build:
      context: ..
      dockerfile: microservices/order-service/Dockerfile
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/order
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://cart-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-grocery-api}
      DEMO_IDENTITY_ENABLED: "false"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in microservices/.env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_FRONTEND_BASE_URL: ${STRIPE_FRONTEND_BASE_URL:-http://localhost:5173}
    ports:
      - "8082:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  product-service:
    build:
      context: ..
      dockerfile: microservices/product-service/Dockerfile
    container_name: product-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/product
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://cart-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-grocery-api}
      DEMO_IDENTITY_ENABLED: "false"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in microservices/.env}
    ports:
      - "8083:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - backend

  ledger-service:
    build:
      context: ..
      dockerfile: microservices/ledger-service/Dockerfile
    container_name: ledger-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/ledger
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://cart-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-grocery-api}
      DEMO_IDENTITY_ENABLED: "false"
    ports:
      - "8084:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      ledger-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9091:9090"
    depends_on:
      - cart-db
      - order-db
      - product-db
      - ledger-db
    networks:
      - backend
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - observability

volumes:
  redis-data:
  cart-db-data:
  order-db-data:
  product-db-data:
  ledger-db-data:

networks:
  backend:
    driver: bridge
  observability: {}
