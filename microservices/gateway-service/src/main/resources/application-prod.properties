# ─────────────────────────────────────────────────────────────────────────────
# Production profile for the gateway.
#
# All identity and upstream values are externalized. Unresolved required
# variables fail startup (no insecure fallback), and ProductionIdentityGuard
# rejects a non-HTTPS issuer, a blank audience, or an enabled demo identity.
# ─────────────────────────────────────────────────────────────────────────────

server.port=${SERVER_PORT:8080}

# ── Upstream service URLs (required) ─────────────────────────────────────────
gateway.services.cart-url=${CART_SERVICE_URL}
gateway.services.order-url=${ORDER_SERVICE_URL}
gateway.services.product-url=${PRODUCT_SERVICE_URL}
gateway.services.summary-url=${SUMMARY_SERVICE_URL}
gateway.services.bff-url=${BFF_URL}

# ── CORS (required, explicit origins only) ───────────────────────────────────
gateway.cors-allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Trusted reverse proxies (optional) ───────────────────────────────────────
# Comma-separated IPs allowed to set X-Forwarded-For for rate-limit keying.
# Empty means XFF is not trusted.
gateway.trusted-proxies=${TRUSTED_PROXIES:}

# ── JWT (required; HTTPS issuer enforced by ProductionIdentityGuard) ─────────
gateway.jwt.issuer-uri=${JWT_ISSUER_URI}
gateway.jwt.audience=${JWT_AUDIENCE}

# ── Rate limiting ────────────────────────────────────────────────────────────
gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
gateway.rate-limit.requested-tokens=${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

# ── Redis (required) ─────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
logging.pattern.console={"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","logger":"%logger","message":"%message"}%n
