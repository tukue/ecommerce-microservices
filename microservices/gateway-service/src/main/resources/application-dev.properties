# ─────────────────────────────────────────────────────────────────────────────
# Dev profile — runs on the developer laptop without Docker.
# All services are expected on their default localhost ports.
# ─────────────────────────────────────────────────────────────────────────────

server.port=8085

# ── Upstream service URLs ────────────────────────────────────────────────────
gateway.services.cart-url=http://localhost:8081
gateway.services.order-url=http://localhost:8082
gateway.services.product-url=http://localhost:8083
gateway.services.summary-url=http://localhost:8084
# Node.js BFF is started by `npm run dev:server` in the frontend directory
gateway.services.bff-url=http://localhost:3000

# ── CORS: allow both the Vite dev server and the BFF port ───────────────────
# Add additional origins as needed (e.g. mobile emulators)
gateway.cors-allowed-origins=http://localhost:5173,http://localhost:3000

# ── JWT: cart-service acts as the demo identity provider on dev ──────────────
# The JWKS endpoint is cart-service's /.well-known/jwks.json
gateway.jwt.issuer-uri=http://localhost:8081
gateway.jwt.audience=grocery-api

# ── Rate limiting ────────────────────────────────────────────────────────────
# Permissive values for local development — high enough not to interfere.
gateway.rate-limit.replenish-rate=100
gateway.rate-limit.burst-capacity=200
gateway.rate-limit.requested-tokens=1

# ── Redis ────────────────────────────────────────────────────────────────────
# Start Redis locally: docker run -p 6379:6379 redis:7-alpine
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Observability ────────────────────────────────────────────────────────────
management.endpoint.health.show-details=always
logging.level.org.springframework.cloud.gateway=DEBUG

# Explicit JWKS endpoint supports standard OIDC providers.
gateway.jwt.jwks-uri=${JWT_JWKS_URI:${gateway.jwt.issuer-uri}/.well-known/jwks.json}

# Enforce the Spring Cloud / Spring Boot compatibility contract.
spring.cloud.compatibility-verifier.enabled=true
