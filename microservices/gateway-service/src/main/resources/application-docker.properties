# ─────────────────────────────────────────────────────────────────────────────
# Docker profile — used when the full stack runs via docker-compose.yml.
# All values reference environment variables so no secrets are committed.
# Unresolved required variables fail startup fast (no fallback for JWT config).
# ─────────────────────────────────────────────────────────────────────────────

server.port=8080

# ── Upstream service URLs ────────────────────────────────────────────────────
# Docker Compose service names are the hostnames on the backend network.
gateway.services.cart-url=http://cart-service:8080
gateway.services.order-url=http://order-service:8080
gateway.services.product-url=http://product-service:8080
gateway.services.summary-url=http://ledger-service:8080
# BFF runs as a separate container on the same backend network
gateway.services.bff-url=http://bff:3000

# ── CORS ─────────────────────────────────────────────────────────────────────
# Injected from docker-compose environment; allows the React dev server and
# any deployed frontend origin. No wildcard — explicit origins only.
gateway.cors-allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── JWT ──────────────────────────────────────────────────────────────────────
# Must be set in the compose environment — no fallback.
# cart-service acts as the demo OIDC issuer; replace with Keycloak/Cognito
# in production.
gateway.jwt.issuer-uri=${JWT_ISSUER_URI}
gateway.jwt.audience=${JWT_AUDIENCE:grocery-api}

# ── Rate limiting ────────────────────────────────────────────────────────────
gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
gateway.rate-limit.requested-tokens=${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

# ── Redis ────────────────────────────────────────────────────────────────────
# Redis is already in docker-compose.yml as `redis` on the backend network.
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Observability ────────────────────────────────────────────────────────────
management.endpoint.health.show-details=when_authorized

# Explicit JWKS endpoint supports standard OIDC providers.
gateway.jwt.jwks-uri=${JWT_JWKS_URI:${gateway.jwt.issuer-uri}/.well-known/jwks.json}

# Enforce the Spring Cloud / Spring Boot compatibility contract.
spring.cloud.compatibility-verifier.enabled=true
