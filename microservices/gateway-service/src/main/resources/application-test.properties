# ─────────────────────────────────────────────────────────────────────────────
# Test profile — used during mvn test. No live Redis, no live upstreams needed.
# SecurityConfig is excluded via @Profile("!test"); tests provide their own
# security configuration via TestSecurityConfig.
# ─────────────────────────────────────────────────────────────────────────────

server.port=0

# ── Upstream URLs ─────────────────────────────────────────────────────────────
# Overridden per test class using MockWebServer dynamic ports.
# These values keep the context from failing on startup.
gateway.services.cart-url=http://localhost:9991
gateway.services.order-url=http://localhost:9992
gateway.services.product-url=http://localhost:9993
gateway.services.summary-url=http://localhost:9994
gateway.services.bff-url=http://localhost:9995

# ── CORS ─────────────────────────────────────────────────────────────────────
gateway.cors-allowed-origins=http://localhost:5173

# ── JWT ──────────────────────────────────────────────────────────────────────
# Not validated in tests — SecurityConfig is disabled by @Profile("!test").
gateway.jwt.issuer-uri=http://localhost:9999
gateway.jwt.audience=grocery-api

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Redis is not required in tests — rate limit filter is not applied when
# spring.data.redis is not available and the test security chain bypasses it.
gateway.rate-limit.replenish-rate=100
gateway.rate-limit.burst-capacity=200
gateway.rate-limit.requested-tokens=1

# The test limiter never connects; disable only the external Redis health check.
management.health.redis.enabled=false

# ── Observability ─────────────────────────────────────────────────────────────
management.endpoint.health.show-details=always
logging.level.org.springframework.cloud.gateway=WARN

# Explicit JWKS endpoint supports standard OIDC providers.
gateway.jwt.jwks-uri=${JWT_JWKS_URI:${gateway.jwt.issuer-uri}/.well-known/jwks.json}

# Enforce the Spring Cloud / Spring Boot compatibility contract.
spring.cloud.compatibility-verifier.enabled=true
