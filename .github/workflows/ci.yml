name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # dorny/test-reporter publishes a check run against the commit SHA.
      checks: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_ecommerce
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The root pom targets release 25, so a lower JDK fails at compile with
      # "release version 25 not supported" and never writes surefire reports.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          # Caches ~/.m2/repository, the same path Trivy reads during scanning.
          cache: maven

      # Per-service test profiles are gitignored, so a fresh checkout has no
      # application-test.properties on the test classpath. Recreate it from the
      # committed example before running the suite.
      - name: Prepare test properties
        run: |
          for service in cart-service order-service product-service ledger-service; do
            cp "microservices/$service/src/test/resources/application-test.properties.example" \
               "microservices/$service/src/test/resources/application-test.properties"
          done

      - name: Run tests
        run: ./mvnw -B -ntp -U verify -Dspring.profiles.active=test

      - name: Generate test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-empty: true

  security-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to upload the SARIF report to the Security tab.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      # Trivy resolves the Maven dependency tree by reading ~/.m2/repository
      # first and only falling back to Maven Central on a miss. GitHub-hosted
      # runners share IP ranges, so those fallbacks hit HTTP 429 rate limiting
      # and abort the scan with a non-zero exit. Resolving dependencies up front
      # keeps the scan off the network. -U also rechecks missing releases:
      # setup-java's Maven cache can restore a previous failed resolution.
      # Use the checked-in wrapper to match local verification.
      - name: Resolve Maven dependencies
        run: ./mvnw -B -ntp -U dependency:go-offline

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Keep the scan bounded; a cold cache plus dependency resolution is slow.
          timeout: '20m'
          skip-dirs: '.git,target,frontend/node_modules'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read

    strategy:
      matrix:
        service: [cart-service, order-service, product-service, ledger-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./microservices/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
